name: CI Build

on:
  push:
    # Build-only on every branch EXCEPT main and snapshot (those release/publish via
    # their dedicated workflows). All other branches only verify.
    branches-ignore:
      - main
      - snapshot
  pull_request:
    branches:
      - '*'

# Least privilege by default; this workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0

  # The docs site is only built and deployed by the snapshot workflow, so a PR
  # cannot break the deploy — except that it can: a dependency bump that npm ci
  # refuses (peer conflict) only surfaces after the merge, in the snapshot
  # build's docs job (mermaid 12 vs vitepress-plugin-mermaid, 2026-09-15). This
  # job runs the same install + build without the Pages deploy, so such PRs go
  # red before they land. Same Node and action pins as reusable-docs.yml.
  docs-check:
    name: Docs build check (no deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Git Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Verify the docs theme matches the shared source
        # Mirrors the check in reusable-docs.yml (v1.3.0+): the theme under
        # docs-site/docs/.vitepress/theme and the Eclipse Foundation assets are
        # owned by eclipse-fennec/.github (docs-theme/). Pinned to the very
        # revision snapshot.yml calls, so a Dependabot bump of that workflow
        # fails here, before the merge, if the theme has to move with it.
        run: |
          set -euo pipefail
          ref=$(grep -o 'reusable-docs.yml@[0-9a-f]*' .github/workflows/snapshot.yml | head -1 | cut -d@ -f2)
          echo "shared docs-theme revision: $ref"
          base="https://raw.githubusercontent.com/eclipse-fennec/.github/$ref/docs-theme"
          status=0
          for rel in index.ts custom.css EclipseFooter.vue public/eclipse-foundation-grey-orange.svg public/eclipse-foundation-white-orange.svg; do
            case "$rel" in
              public/*) target="docs-site/docs/public/${rel#public/}" ;;
              *)        target="docs-site/docs/.vitepress/theme/$rel" ;;
            esac
            curl -sfL "$base/$rel" -o "/tmp/shared-$(basename "$rel")"
            if ! cmp -s "/tmp/shared-$(basename "$rel")" "$target"; then
              echo "::error file=$target::does not match docs-theme/$rel in eclipse-fennec/.github@$ref"
              status=1
            fi
          done
          exit $status
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build docs
        working-directory: docs-site
        env:
          DOCS_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: npm run docs:build
