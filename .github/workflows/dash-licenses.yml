name: License Check (IP Dash)

on:
  push:
    # Run on the primary branches.
    branches:
      - main
      - snapshot
  pull_request:
    # Run for all pull requests.
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dash:
    name: Eclipse Dash license check
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: 21
      - name: Generate DEPENDENCIES and check licenses
        # Exits non-zero (the number of "restricted" artifacts) when something
        # has not been vetted yet. Regenerate and review locally with:
        #   tools/dash-licenses.sh [--review]
        #
        # The list is now what this build names rather than what the
        # workspace's Maven indexes offer (#90): 147 of 464 coordinates, and
        # two of them restricted instead of thirty-one. Both are real —
        # biz.aQute.gogo.commands.provider and org.apache.felix.http.jetty12,
        # each of which this project resolves into a launch.
        #
        # Still not blocking, but for a reason somebody can act on now: those
        # two need an Eclipse IP review, which `tools/dash-licenses.sh --review`
        # opens given an IP Lab token and the project id. The exception comes
        # out when they come back approved.
        continue-on-error: true
        run: bash tools/dash-licenses.sh
      - name: Upload DEPENDENCIES
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: DEPENDENCIES
          path: DEPENDENCIES
          if-no-files-found: warn
