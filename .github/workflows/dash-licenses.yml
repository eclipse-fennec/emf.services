name: License Check (IP Dash)

on:
  push:
    # Run on the primary branches.
    branches:
      - main
      - snapshot
  pull_request:
    # Run for all pull requests.
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dash:
    name: Eclipse Dash license check
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21
      - name: Generate DEPENDENCIES and check licenses
        # Exits non-zero (the number of "restricted" artifacts) when something
        # has not been vetted yet. Regenerate and review locally with:
        #   tools/dash-licenses.sh [--review]
        #
        # Not blocking yet, on purpose. The list comes from the workspace's
        # Maven index, and that index offers far more than this project uses:
        # 90 of 403 artifacts are referenced anywhere in the build, and 28 of
        # the 31 restricted ones are content that never reaches a bundle here.
        # Failing the build on those would be a red check about other people's
        # code. The exception goes away with the list — see the follow-up
        # issue on narrowing it to what is actually resolved.
        continue-on-error: true
        run: bash tools/dash-licenses.sh
      - name: Upload DEPENDENCIES
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DEPENDENCIES
          path: DEPENDENCIES
          if-no-files-found: warn
