name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NOT group "pages": the reusable workflow's deploy JOB declares its own
# job-level `concurrency: pages`; if the calling workflow holds the same
# group, the job deadlocks and fails instantly with zero steps.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1
