name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# NOT group "pages": the reusable workflow's deploy JOB declares its own
# job-level `concurrency: pages`; if the calling workflow holds the same
# group, the job deadlocks and fails instantly with zero steps.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@5b25efac2c99c0f88252d1a45302b8a1ae5876ce # v1.4.0
