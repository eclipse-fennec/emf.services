name: Release Build

on:
  push:
    branches:
      - main

# Workflow-level ceiling for the called reusables. Only the docs deploy needs the
# pages/id-token scopes; the credential-scoped release step gets its secrets via
# `secrets: inherit` below (verify + docs never see them).
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@4c8b1daf597d0ae439253b59c42d7e52049d5137 # v1.1.2
    with:
      do-release: true
      # bnd export is not parallel-safe in this workspace.
      gradle-parallel: false
      # Export the broker launch in the SAME build that publishes to Maven and
      # hand both jars to the container job as the release-jars artifact, so the
      # image cannot drift from the published bundles.
      extra-gradle-tasks: >-
        org.eclipse.fennec.services.broker.rest:export.broker
      artifact-paths: |
        org.eclipse.fennec.services.broker.rest/generated/distributions/executable/broker.jar
        org.eclipse.fennec.services.broker.rest/generated/org.eclipse.fennec.services.broker.rest.jar
    secrets: inherit

  docs:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@9292fbff296548018fa9e4b0f6ad49ba7c639501 # v1.1.1

  # image tagging follows the data.atlas scheme: broker-latest
  container-broker:
    needs: release
    uses: ./.github/workflows/reusable-container.yml
    with:
      docker-label: latest
      variant: broker
      runtime-jar: broker.jar
      version-bundle-jar: org.eclipse.fennec.services.broker.rest.jar
      docker-context: docker/broker/
    secrets: inherit
