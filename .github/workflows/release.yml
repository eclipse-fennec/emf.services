name: Release Build

on:
  push:
    branches:
      - main

# Workflow-level ceiling for the called reusables. Only the docs deploy needs the
# pages/id-token scopes; the credential-scoped release step gets its secrets via
# `secrets: inherit` below (verify + docs never see them).
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0
    with:
      do-release: true
      # bnd export is not parallel-safe in this workspace.
      gradle-parallel: false
      # Export the broker launch in the SAME build that publishes to Maven and
      # hand both jars to the container job as the release-jars artifact, so the
      # image cannot drift from the published bundles.
      extra-gradle-tasks: >-
        org.eclipse.fennec.services.broker.rest:export.broker
      artifact-paths: |
        org.eclipse.fennec.services.broker.rest/generated/distributions/executable/broker.jar
        org.eclipse.fennec.services.broker.rest/generated/org.eclipse.fennec.services.broker.rest.jar
    secrets: inherit

  docs:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0

  # One image, one variant prefix, as data.atlas tags its own: broker-latest
  # plus broker-<Bundle-Version>. The template is pinned to a commit like every
  # other central workflow here; v1.4.0 will be the first tag that carries it.
  container-broker:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-container.yml@ff0237b059b28c6c2c62dfa68b521971ce00327f # main, post-v1.3.0
    with:
      image-name: emf.services
      docker-label: latest
      variant: broker
      docker-context: docker/broker
      # Declarative staging: the jar lands in content/broker.jar, which is what
      # the Dockerfile COPYs and what :docker:broker:prepareDocker writes for a
      # local build. No runtime-dir — this image carries nothing but the jar.
      runtime-jar: broker.jar
      version-jar: org.eclipse.fennec.services.broker.rest.jar
    secrets: inherit
