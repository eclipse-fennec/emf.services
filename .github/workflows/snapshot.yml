name: Snapshot Build

on:
  push:
    branches:
      - snapshot
  # By hand, for the day a push did not start it: the runs of #236 were
  # left queued by a GitHub Actions outage and could be neither cancelled
  # nor re-run. `gh workflow run snapshot.yml --ref snapshot`.
  workflow_dispatch:

# Workflow-level ceiling for the called reusables. Only the docs deploy needs the
# pages/id-token scopes; the credential-scoped release step gets its secrets via
# `secrets: inherit` below (verify + docs never see them).
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: snapshot-publish
  cancel-in-progress: false

jobs:
  verify:
    # A manual run can be started on any ref; a snapshot is only ever
    # published from the snapshot branch. Everything below needs this job.
    if: github.ref == 'refs/heads/snapshot'
    uses: eclipse-fennec/.github/.github/workflows/reusable-verify.yml@5b25efac2c99c0f88252d1a45302b8a1ae5876ce # v1.4.0

  release:
    needs: verify
    uses: eclipse-fennec/.github/.github/workflows/reusable-release.yml@5b25efac2c99c0f88252d1a45302b8a1ae5876ce # v1.4.0
    with:
      do-release: false
      # bnd export is not parallel-safe in this workspace.
      gradle-parallel: false
      # Export the broker launch in the SAME build that publishes to Maven and
      # hand both jars to the container job as the release-jars artifact, so the
      # image cannot drift from the published bundles.
      extra-gradle-tasks: >-
        org.eclipse.fennec.services.broker.rest:export.broker
      artifact-paths: |
        org.eclipse.fennec.services.broker.rest/generated/distributions/executable/broker.jar
        org.eclipse.fennec.services.broker.rest/generated/org.eclipse.fennec.services.broker.rest.jar
    secrets: inherit

  # bnd's releaser logs a refused upload ("something went wrong during upload")
  # and the Gradle task stays green, so a snapshot that only partly reached
  # Central looked like a good one: since 2026-11-12 Central answers bursts with
  # HTTP 429 (Cloudflare 1015) and most bundles of a run were refused (#261).
  # This job reads the release job's log and fails the run, naming the bundles.
  # Belongs into the central reusable-release workflow eventually.
  uploads:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Every upload reached Central
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          job=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" --paginate \
            -q '.jobs[] | select(.name | startswith("release")) | .id' | head -1)
          [ -n "$job" ] || { echo "::error::no release job in this run"; exit 1; }
          # The log of a job that has just finished can take a moment to appear.
          for attempt in 1 2 3 4 5 6; do
            if gh api "repos/$REPO/actions/jobs/$job/logs" > release.log 2>/dev/null && [ -s release.log ]; then
              break
            fi
            sleep 10
          done
          [ -s release.log ] || { echo "::error::the release job's log could not be read"; exit 1; }
          uploaded=$(grep -c 'Upload https://' release.log || true)
          failed=$(grep -c 'something went wrong during upload' release.log || true)
          echo "uploads: $uploaded, refused: $failed"
          if [ "$failed" -gt 0 ]; then
            grep -o 'Could not store [^ ]*' release.log | sed 's|.*/services/\([^/]*\)/.*|\1|' | sort -u \
              | sed 's/^/  not on Central: /'
            grep -m1 -o 'You are being rate limited\|code=[0-9]*' release.log | sed 's/^/  cause: /' || true
            echo "::error::$failed upload(s) to Maven Central were refused - the snapshot on Central is incomplete"
            exit 1
          fi

  docs:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-docs.yml@2a98ad6e2459556b858e1273bff2f8d87fc11a06 # v1.3.0

  # One image, one variant prefix, as data.atlas tags its own: broker-snapshot
  # plus broker-<Bundle-Version>. The template is pinned to a commit like every
  # other central workflow here; v1.4.0 will be the first tag that carries it.
  container-broker:
    needs: release
    uses: eclipse-fennec/.github/.github/workflows/reusable-container.yml@5b25efac2c99c0f88252d1a45302b8a1ae5876ce # main, post-v1.3.0
    with:
      image-name: emf.services
      docker-label: snapshot
      variant: broker
      docker-context: docker/broker
      # Declarative staging: the jar lands in content/broker.jar, which is what
      # the Dockerfile COPYs and what :docker:broker:prepareDocker writes for a
      # local build. No runtime-dir — this image carries nothing but the jar.
      runtime-jar: broker.jar
      version-jar: org.eclipse.fennec.services.broker.rest.jar
    secrets: inherit
