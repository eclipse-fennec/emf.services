    pattern: |
      This program and the accompanying materials are made
      available under the terms of the Eclipse Public License 2.0
      which is available at https://www.eclipse.org/legal/epl-2.0/
      SPDX-License-Identifier: EPL-2.0
  paths-ignore:
    - 'dist'
    - 'licenses'
    # golden fingerprint fixtures are hash-pinned byte-for-byte
    - 'itest/fixtures/**'
    # generated code (emfts-codegen resp. EMF codegen into legacy src/)
    - 'ddsr-ts-client/packages/ddsr-model/src/**'
    - 'org.eclipse.fennec.services.examples.model/src/**'
    # container build files and configs
    - '**/Containerfile*'
    - '**/*.conf'
    - '**/.dockerignore'
    # pnpm workspace metadata
    - '**/*.yaml'
    - '**/*.yml'
    - '**/package-info.java'
    - '**/packageinfo'
    - '**/module-info.java'
    - '**/*.sh'
    - '**/*.bnd'
    - '**/*.bndrun'
    - '**/*.xml'
    - '**/*.csv'
    - '**/*.json'
    - '**/*.ecore'
    - '**/*.xcore'
    - '**/*.genmodel'
    # Authored mapping documents — XMI like *.ecore and *.xmi beside them.
    - '**/*.esearch'
    - '**/*.md'
    - '**/*.MD'
    - '**/.keep'
    - '**/.gitkeep'
    - '**/*.jetproperties'
    - '**/*.javajet'
    - '**/*.javajetinc'
    - '**/*.properties'
    - '**/*.maven'
    - '**/*.mvn'
    - '**/*.MF'
    - '**/*.html'
    - '**/*.drawio*'
    - '**/*.ftl'
    - '**/*.aird'
    - '**/*.basic'
    - '**/*.txt'
    - '**/*.eorm'
    - '**/*.sql'
    - '**/*.xmi'
    - '**/*.db'
    - '**/.classpath'
    - 'LICENSE'
    - 'Jenkinsfile'
    - 'NOTICE'
    - 'cnf/**'
    - '**/src-gen/**'
    - '**/generated/**'
    - '.gitattributes'
    - '.github/**'
    - '.gitignore'
    - 'cnf/release/**.*'
    - '.gradle-wrapper/gradle-wrapper.properties'
    - '.licenserc.yaml'
    - '**/.project'
    - '**/*.prefs'
    - 'build.gradle'
    - 'gradle.properties'
    - 'gradlew'
    - 'gradlew.bat'
    - 'settings.gradle'
    - 'old/**'
    - 'docs-site/**'
    - '**/*.dragino'

  comment: always
